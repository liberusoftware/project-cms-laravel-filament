name: Sync modules and themes

on:
  push:
    branches: [codex/reconcile-core-packages-20261114]
    paths:
      - '.github/scripts/reconcile-packagist.py'
      - '.github/workflows/sync-packages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-core-packages
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'liberusoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: packagist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read the current branch so a queued run cannot restore an older snapshot.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test package publisher
        run: python3 -m py_compile .github/scripts/reconcile-packagist.py

      - name: Configure cross-repository authentication
        env:
          GH_TOKEN: ${{ secrets.MODULE_SYNC_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo '::error::Set MODULE_SYNC_TOKEN'; exit 1; }
          gh auth setup-git

      - name: Sync, release, and submit to Packagist
        env:
          GH_TOKEN: ${{ secrets.MODULE_SYNC_TOKEN }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: python3 .github/scripts/reconcile-packagist.py

      - name: Preserve publication results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-publication-results
          path: package-publication-results.jsonl
          if-no-files-found: warn
