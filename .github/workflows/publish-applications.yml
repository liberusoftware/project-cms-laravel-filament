name: Publish public Composer applications
on:
  push:
    branches: [codex/publish-applications-20261114]
    paths: ['.github/scripts/publish-applications.py', '.github/application-publication.json', '.github/workflows/publish-applications.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'liberusoftware/project-cms-laravel-filament'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: packagist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Validate publisher syntax
        run: python3 -m py_compile .github/scripts/publish-applications.py
      - name: Submit public applications to Packagist
        env:
          GH_TOKEN: ${{ secrets.MODULE_SYNC_TOKEN }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: python3 .github/scripts/publish-applications.py
      - name: Preserve publication results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: application-publication-results
          path: application-publication-results.jsonl
